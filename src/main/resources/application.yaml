spring:
  application:
    name: redshelter
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    refresh-ttl-web: ${AUTH_REFRESH_TTL_WEB:12h}
    refresh-ttl-mobile: ${AUTH_REFRESH_TTL_MOBILE:30d}
    max-sessions: ${AUTH_MAX_SESSIONS:5}
    cleanup-retention: ${AUTH_CLEANUP_RETENTION:30d}
    cleanup-cron: "0 0 3 * * *"
seed:
  admin:
    enabled: ${ADMIN_SEED_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrador}
    phone: ${ADMIN_PHONE:}